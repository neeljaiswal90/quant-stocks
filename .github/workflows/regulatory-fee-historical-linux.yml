name: Regulatory-fee historical schedule Linux replay

on:
  pull_request:
    paths:
      - ".github/workflows/regulatory-fee-historical-linux.yml"
      - "configs/governance/regulatory-fee-historical-schedule-v1.json"
      - "configs/governance/regulatory-fee-historical-schedule-v1.hashes.json"
      - "docs/governance/REGULATORY_FEE_HISTORICAL_SCHEDULE_V1.md"
      - "qme/quant/regulatory_fee_schedule.py"
      - "schemas/governance/regulatory-fee-historical-schedule-v1.schema.json"
      - "tests/fixtures/governance/regulatory-fee-historical-official-sources-v1.json"
      - "tests/fixtures/quant/regulatory-fee-historical-schedule-v1.cases.json"
      - "tests/quant/test_regulatory_fee_schedule.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/regulatory-fee-historical-linux.yml"
      - "configs/governance/regulatory-fee-historical-schedule-v1.json"
      - "configs/governance/regulatory-fee-historical-schedule-v1.hashes.json"
      - "docs/governance/REGULATORY_FEE_HISTORICAL_SCHEDULE_V1.md"
      - "qme/quant/regulatory_fee_schedule.py"
      - "schemas/governance/regulatory-fee-historical-schedule-v1.schema.json"
      - "tests/fixtures/governance/regulatory-fee-historical-official-sources-v1.json"
      - "tests/fixtures/quant/regulatory-fee-historical-schedule-v1.cases.json"
      - "tests/quant/test_regulatory_fee_schedule.py"

permissions:
  contents: read

jobs:
  deterministic-schedule-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Assert frozen Python runtime
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3, 12, 10)"
      - name: Install pinned development environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Replay exact official historical schedule
        run: |
          python -m pytest -q -p no:cacheprovider tests/quant/test_regulatory_fee_schedule.py
          python -c "from pathlib import Path; from qme.quant.regulatory_fee_schedule import verify_historical_schedule_evidence, verify_historical_schedule_manifest; verify_historical_schedule_evidence(Path('.')); verify_historical_schedule_manifest(Path('.'))"
