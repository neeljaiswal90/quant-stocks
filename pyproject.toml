[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qme"
version = "0.1.0"
description = "Deterministic quantitative momentum research with bounded agent review"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Windows does not ship an IANA timezone database for zoneinfo. Pin the
    # database so exchange-session boundaries are reproducible in clean installs.
    "tzdata==2026.3",
]

[project.optional-dependencies]
agents = [
    "tradingagents @ https://github.com/tauricresearch/tradingagents/archive/a33fd4c0f134485a43553a2c23a63cb14adbd88f.zip#sha256=64fcea57cc6e78bae473a9d7bc2909e829950489dec6f696c9360f944eca6192",
]
dev = [
    "build==1.3.0",
    "detect-secrets==1.5.0",
    "jsonschema==4.26.0",
    "mypy==2.1.0",
    "pip==25.3",
    "pip-tools==7.6.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
    "setuptools==80.9.0",
    "wheel==0.46.3",
]

[project.scripts]
qme-agent-review = "qme.cli.agent_review:main"
qme-foundation = "qme.cli.foundation:main"

[tool.setuptools.packages.find]
include = ["qme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires the pinned TradingAgents dependency and a local model server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["qme"]
warn_unreachable = true
